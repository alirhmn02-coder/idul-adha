<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Idul Adha 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Menggunakan gambar pemandangan serupa dengan image.jpg */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('gg.jpg') no-repeat center center/cover;
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow: hidden;
        }

        .main-card {
            background: rgba(44, 62, 80, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .arabic-text {
            color: var(--gold);
            font-size: 2rem;
            margin: 10px 0 30px 0;
            font-weight: 300;
        }

        .divider {
            height: 1px;
            width: 60%;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 30px;
        }

        #countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 10px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .number {
            display: block;
            font-size: 2.2rem;
            font-weight: 600;
        }

        .label {
            font-size: 0.8rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <h1>Idul Adha</h1>
    <div class="arabic-text">عيد الأضحى</div>
    <div class="divider"></div>

    <div id="countdown">
        <div class="box">
            <span class="number" id="days">00</span>
            <span class="label">Hari</span>
        </div>
        <div class="box">
            <span class="number" id="hours">00</span>
            <span class="label">Jam</span>
        </div>
        <div class="box">
            <span class="number" id="minutes">00</span>
            <span class="label">Menit</span>
        </div>
        <div class="box">
            <span class="number" id="seconds">00</span>
            <span class="label">Detik</span>
        </div>
    </div>

    <div class="footer-text">Menuju Hari Raya Idul Adha 🌙</div>
</div>

<script>
    // Target: 27 Mei 2026 (Perkiraan Idul Adha 1447 H)
    const targetDate = new Date("May 27, 2026 00:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff < 0) {
            document.querySelector(".main-card").innerHTML = "<h1>Selamat Idul Adha!</h1>";
            return;
        }

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = d.toString().padStart(2, '0');
        document.getElementById("hours").innerText = h.toString().padStart(2, '0');
        document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
        document.getElementById("seconds").innerText = s.toString().padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

</body>
</html>
